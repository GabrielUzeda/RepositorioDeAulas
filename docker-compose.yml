services:
  bun-server:
    image: oven/bun:1
    container_name: bun-server
    env_file:
      - .env
    volumes:
      - ./backend/:/app
      - ./frontend/:/app/frontend_static
    working_dir: /app
    command: sh -c "bun install && bun run src/index.ts"
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - web-network
    restart: unless-stopped
  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/:/usr/share/nginx/html:ro
      - ./conf/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - web-network
    depends_on:
      - bun-server

networks:
  web-network:
    driver: bridge
