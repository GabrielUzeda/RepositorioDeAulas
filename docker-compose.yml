services:
  bun-server:
    image: oven/bun:1
    container_name: bun-server
    env_file:
      - .env
    volumes:
      - ./backend/:/app
      - backend_node_modules:/app/node_modules
      - ./frontend-vue/dist/:/app/frontend_static
    working_dir: /app
    command: sh -c "bun install && bun run src/index.ts"
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - web-network
    restart: unless-stopped
  vite:
    image: oven/bun:1
    container_name: vite
    environment:
      VITE_PROXY_TARGET: http://bun-server:8080
    volumes:
      - ./frontend-vue/:/app
      - vite_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks:
      - web-network
    depends_on:
      - bun-server
    restart: unless-stopped

networks:
  web-network:
    driver: bridge

volumes:
  backend_node_modules:
  vite_node_modules:
