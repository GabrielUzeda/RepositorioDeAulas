services:
  rust-server:
    image: alpine:latest
    container_name: rust-server
    env_file:
      - .env
    volumes:
      - ./bin/rust-app:/app/rust-app
      - ${backDir}/templates:/app/templates
      - ${frontDir}:/app/frontend_static
    working_dir: /app
    command: sh -c "apk add --no-cache libgcc openssl nodejs npm && npm install -g @marp-team/marp-cli && ./rust-app"
    expose:
      - "8080"
    ports:
      - "8080:8080"
    networks:
      - web-network
    depends_on:
      - db
    restart: unless-stopped


  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - rust-server
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env                          # injeta SERVER_NAME para o script
    volumes:
      - ./conf/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./conf/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ${frontDir}:/usr/share/nginx/html/:ro
      - ${verificationDir}:/var/www/certbot
      - ${sslDir}:/etc/letsencrypt
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - web-network


  certbot:
    image: certbot/certbot:latest
    container_name: certbot-renewer
    env_file:
      - .env
    volumes:
      - ${verificationDir}:/var/www/certbot
      - ${sslDir}:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while true; do
             certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h;
             done"
    restart: unless-stopped
    networks:
      - web-network

  db:
    image: postgres:alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web-network

networks:
  web-network:
    driver: bridge

volumes:
  postgres_data:
