# =============================================================================
# docker-compose.prod.yml — Produção
#
# OPÇÃO A — COM nginx + Certbot (HTTPS automático via ACME/Let's Encrypt)
#   Ideal para servidores dedicados sem nginx no host.
#   Uso: docker compose -f docker-compose.prod.yml --profile with-nginx up -d
#   A configuração do nginx fica na pasta ./nginx/ (nginx.conf.template +
#   docker-entrypoint.sh + conf.d/*.template). O entrypoint detecta o
#   certificado e alterna entre HTTP-only (primeiro boot, para o desafio ACME)
#   e HTTPS completo.
#
# OPÇÃO B — SEM nginx (proxy reverso externo no host, ex: seu nginx principal)
#   O bun-server fica em 127.0.0.1:${PORT:-8080} (BIND_ADDRESS trocável), e o
#   proxy do host repassa o tráfego — o proxy DEVE repassar /api, /materias,
#   /disciplinas e /cursos para o bun-server para preservar senha de curso/CSP.
#   Uso: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:

  # --------------------------------------------------------------------------
  # bun-server — Backend Bun + API Hono + serve o SPA Vue buildado
  # Ativo em ambas as opções (A e B)
  # --------------------------------------------------------------------------
  bun-server:
    image: oven/bun:1.2
    container_name: bun-server
    env_file:
      - .env
    volumes:
      - ./backend/:/app
      - backend_node_modules:/app/node_modules
      - ./frontend/dist/:/app/frontend_static
    working_dir: /app
    command: sh -c "bun install --production && bun run src/index.ts"
    expose:
      - "8080"
    ports:
      # Opção B: 127.0.0.1:PORT no host para o proxy externo (README usa 127.0.0.1:8080).
      # Opção A: mesmo assim, a API NÃO fica exposta na rede — apenas loopback do host.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # nginx — Reverse Proxy com HTTPS/TLS + ACME challenge (Opção A)
  # Só sobe quando o profile "with-nginx" é ativado
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-proxy
    profiles:
      - with-nginx
    depends_on:
      - bun-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      verificationDir: ${verificationDir:-/var/www/certbot}
    env_file:
      - .env
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d-templates:ro
      - ./frontend/dist/:/usr/share/nginx/html:ro
      - ${sslDir:-/var/www/ssl}:/etc/letsencrypt
      - ${verificationDir:-/var/www/certbot}:/var/www/certbot
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # certbot — Emissão e renovação automática de certificados Let's Encrypt
  # Só sobe quando o profile "with-nginx" é ativado
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:v3.0.0
    container_name: certbot-renewer
    profiles:
      - with-nginx
    env_file:
      - .env
    volumes:
      - ${sslDir:-/var/www/ssl}:/etc/letsencrypt
      - ${verificationDir:-/var/www/certbot}:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while true; do
             certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!};
             done"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  backend_node_modules: