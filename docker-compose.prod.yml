# =============================================================================
# docker-compose.prod.yml — Produção (serviço único bun-server; TLS na borda do host)
#
# Serviço único bun-server (Bun + Hono + SPA Vue buildado). O TLS, HSTS,
# redirect HTTP→HTTPS e o desafio ACME são responsabilidade do proxy externo
# no host — o proxy DEVE repassar /api, /materias, /disciplinas e /cursos para
# o bun-server para preservar senha de curso/CSP.
# Uso: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:

  # --------------------------------------------------------------------------
  # bun-server — Backend Bun + API Hono + serve o SPA Vue buildado
  # --------------------------------------------------------------------------
  bun-server:
    image: oven/bun:1.2
    container_name: bun-server
    env_file:
      - .env
    volumes:
      - ./backend/:/app
      - backend_node_modules:/app/node_modules
      - ./frontend/dist/:/app/frontend_static
    working_dir: /app
    command: sh -c "bun install --production && bun run src/index.ts"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    network_mode: "host"
    restart: unless-stopped

volumes:
  backend_node_modules: