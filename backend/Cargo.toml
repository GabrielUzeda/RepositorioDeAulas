[package]
name = "rust-app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1", "smtp-transport", "serde", "tokio1-native-tls"] }
dotenvy = "0.15"
rand = "0.8"
rand_chacha = "0.3"
anyhow = "1"


# Postgres
sqlx = { version = "0.7", features = [ "runtime-tokio-native-tls", "macros", "postgres", "uuid", "chrono", "migrate" ] }
chrono = { version = "0.4.43", features = ["serde"] }
