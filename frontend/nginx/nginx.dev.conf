server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # API Proxy
    location ~ ^/(api|send-mail|check-auth|db-test|ranking|cursos/?$|cursos/[0-9]+/?$|cursos/[0-9]+/materias|materias/?$|materias/[0-9]+/?$|materias/[^/]+/aulas/|aulas/?$|aulas/[0-9]+/?$|atividades/?$|atividades/[0-9]+/?$|professores|professores/[0-9]+/?$) {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://bun-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA - fallback para o app Vue (aluno, professor, admin, login)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
