<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade de Reforço</title>
  <script src="https://code.jquery.com/jquery-4.0.0.slim.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8">
  <!-- Toast de Vitória -->
  <div id="toast-vitoria"
    class="hidden fixed top-4 right-4 z-50 bg-gradient-to-r from-green-500 to-emerald-500 text-white px-6 py-4 rounded-xl shadow-2xl max-w-md transform transition-all duration-500">
    <div class="flex items-center gap-4">
      <span class="material-icons text-4xl">emoji_events</span>
      <div>
        <h3 class="font-bold text-lg">🎉 Parabéns!</h3>
        <p class="text-sm text-green-50">Você acertou todas as questões!</p>
      </div>
      <button onclick="$('#toast-vitoria').addClass('hidden')" class="ml-4 hover:bg-white/20 rounded-full p-1">
        <span class="material-icons">close</span>
      </button>
    </div>
  </div>

  <div class="container mx-auto px-4 max-w-3xl">
    <div class="bg-white rounded-2xl shadow-2xl p-8 mb-8">
      <h1 class="text-4xl font-bold text-indigo-600 mb-2 flex items-center gap-3">
        <span class="material-icons text-5xl">quiz</span>
        Atividade de Reforço
      </h1>
      <p class="text-gray-600 mb-6">Responda todas as questões sem medo de errar! Voce nao sera avaliado aqui</p>

      <div class="flex items-center justify-between mb-6 bg-indigo-50 rounded-lg p-4">
        <div class="flex items-center gap-2">
          <span class="material-icons text-indigo-600">emoji_events</span>
          <span class="font-semibold text-gray-700">Progresso:</span>
        </div>
        <div class="text-2xl font-bold text-indigo-600">
          <span id="acertos">0</span> / <span id="total">0</span>
        </div>
      </div>
    </div>

    <div id="questoes-container"></div>
  </div>

  <script>
    const quizData = {
      "questoes": [
        {
          "id": 1,
          "enunciado": "Qual a forma correta de declarar uma string em Python?",
          "alternativas": [
            { "letra": "A", "texto": "texto = 'She said \"hi\"'", "correta": true },
            { "letra": "B", "texto": "texto = \"She said \"hi\"\"", "correta": false },
            { "letra": "C", "texto": "texto = 'She said \\\"hi\\\"'", "correta": true },
            { "letra": "D", "texto": "texto = \"She said 'hi'\"", "correta": true }
          ],
          "justificativas": {
            "B": "Incorreto. Essa sintaxe quebra a string porque as aspas duplas internas fecham a externa — é necessário escapar ou usar aspas simples por fora.",
            "C": "Observação: esta alternativa é equivalente à A (usa escape). Mantenha atenção: há mais de uma forma correta; se precisar de apenas uma correta, escolha a A ou C conforme sua preferência."
          }
        },
        {
          "id": 2,
          "enunciado": "Qual expressão gera o número float 2.5 em Python?",
          "alternativas": [
            { "letra": "A", "texto": "valor = 5/2", "correta": true },
            { "letra": "B", "texto": "valor = 5//2", "correta": false },
            { "letra": "C", "texto": "valor = float('5/2')", "correta": false },
            { "letra": "D", "texto": "valor = 5.0 // 2", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. O operador '//' é divisão inteira (floor) e resultaria em 2 (int em Python 3).",
            "C": "Incorreto. float('5/2') tenta converter a string '5/2' para float e gera erro — não é expressão aritmética.",
            "D": "Incorreto. 5.0 // 2 resulta em 2.0 por divisão inteira com float, não 2.5."
          }
        },
        {
          "id": 3,
          "enunciado": "Dado `lista = [10, 20, 30]`, qual expressão acessa o último elemento?",
          "alternativas": [
            { "letra": "A", "texto": "lista[-1]", "correta": true },
            { "letra": "B", "texto": "lista[3]", "correta": false },
            { "letra": "C", "texto": "lista[len(lista)]", "correta": false },
            { "letra": "D", "texto": "lista.pop()", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. Índices são zero-based; lista[3] causa IndexError para uma lista com 3 itens.",
            "C": "Incorreto. len(lista) == 3; lista[3] também daria IndexError — último índice é len(lista)-1.",
            "D": "Incorreto. lista.pop() retorna e remove o último elemento — não é apenas acesso (altera a lista)."
          }
        },
        {
          "id": 4,
          "enunciado": "Qual `for` em Python percorre os elementos da lista `valores = [1,2,3]` corretamente?",
          "alternativas": [
            { "letra": "A", "texto": "for v in valores:\n    print(v)", "correta": true },
            { "letra": "B", "texto": "for (v : valores):\n    print(v)", "correta": false },
            { "letra": "C", "texto": "for i = 0; i < len(valores); i++:\n    print(valores[i])", "correta": false },
            { "letra": "D", "texto": "for v in range(valores):\n    print(v)", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. Sintaxe inválida em Python (parece mais com outras linguagens).",
            "C": "Incorreto. Estrutura de for estilo C não existe em Python.",
            "D": "Incorreto. range() espera um inteiro; passar uma lista causa TypeError."
          }
        },
        {
          "id": 5,
          "enunciado": "Considere:\n```\ncontador = 1\nwhile contador <= 3:\n    print(contador)\n```\nQual linha está faltando para evitar loop infinito e mostrar 1,2,3?",
          "alternativas": [
            { "letra": "A", "texto": "contador = contador + 1", "correta": true },
            { "letra": "B", "texto": "break", "correta": false },
            { "letra": "C", "texto": "contador += '1'", "correta": false },
            { "letra": "D", "texto": "continue", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. `break` sairia do laço, mas não é a forma correta de avançar a variável de controle (além de interromper após primeira iteração se colocado logo).",
            "C": "Incorreto. Somar string a inteiro causa TypeError; não atualizaria corretamente.",
            "D": "Incorreto. `continue` pula o resto do laço e volta à condição, não altera o contador por si só—poderia até manter o loop infinito."
          }
        },
        {
          "id": 6,
          "enunciado": "Qual dessas formas converte corretamente a string `'3.14'` para float?",
          "alternativas": [
            { "letra": "A", "texto": "f = float('3.14')", "correta": true },
            { "letra": "B", "texto": "f = int('3.14')", "correta": false },
            { "letra": "C", "texto": "f = '3.14'.toFloat()", "correta": false },
            { "letra": "D", "texto": "f = float(3,14)", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. int('3.14') lança ValueError porque '3.14' não é representação inteira válida.",
            "C": "Incorreto. `.toFloat()` não é método em strings Python.",
            "D": "Incorreto. float(3,14) passa dois argumentos (3 e 14) e causaria TypeError."
          }
        },
        {
          "id": 7,
          "enunciado": "Pegadinha: qual expressão cria uma lista vazia em Python?",
          "alternativas": [
            { "letra": "A", "texto": "l = []", "correta": true },
            { "letra": "B", "texto": "l = list()", "correta": true },
            { "letra": "C", "texto": "l = ()", "correta": false },
            { "letra": "D", "texto": "l = ''", "correta": false }
          ],
          "justificativas": {
            "C": "Incorreto. () cria uma tupla vazia, não uma lista.",
            "D": "Incorreto. '' é string vazia."
          }
        },
        {
          "id": 8,
          "enunciado": "Importação: qual é a forma correta de importar a sub-biblioteca `pyplot` do `matplotlib` comumente usada?",
          "alternativas": [
            { "letra": "A", "texto": "import matplotlib.pyplot as plt", "correta": true },
            { "letra": "B", "texto": "from matplotlib import pyplot as plt", "correta": true },
            { "letra": "C", "texto": "import pyplot from matplotlib", "correta": false },
            { "letra": "D", "texto": "import matplotlib as plt", "correta": false }
          ],
          "justificativas": {
            "C": "Incorreto. Sintaxe inválida — ordem e palavras-chave trocadas.",
            "D": "Incorreto. `import matplotlib as plt` importa o pacote raiz com alias plt, mas o usual e funcional para plot é importar matplotlib.pyplot como plt; usar o pacote raiz não garante acesso direto a pyplot."
          }
        },
        {
          "id": 9,
          "enunciado": "Plotagem simples: qual sequência de comandos plota os pontos x=[1,2,3] y=[2,4,6] e mostra o gráfico?",
          "alternativas": [
            { "letra": "A", "texto": "import matplotlib.pyplot as plt\nplt.plot([1,2,3], [2,4,6])\nplt.show()", "correta": true },
            { "letra": "B", "texto": "import matplotlib as plt\nplt.plot([1,2,3], [2,4,6])\nplt.show()", "correta": false },
            { "letra": "C", "texto": "from matplotlib import plot\nplot([1,2,3], [2,4,6])\nshow()", "correta": false },
            { "letra": "D", "texto": "import matplotlib.pyplot as plt\nplt.plot((1,2,3), (2,4,6))\nplt.show()", "correta": true }
          ],
          "justificativas": {
            "B": "Incorreto. `matplotlib` raiz não tem função `plot` diretamente acessível via esse alias; a sub-biblioteca pyplot é a correta.",
            "C": "Incorreto. `matplotlib` não exporta `plot` diretamente assim e `show()` sem namespace causaria NameError.",
            "D": "Observação: alternativa D é funcional também (tuplas funcionam como listas para plot). Então há mais de uma resposta correta prática (A e D)."
          }
        },
        {
          "id": 10,
          "enunciado": "Pegadinha com parênteses: o que acontece com a expressão `x = ('abc')` em Python?",
          "alternativas": [
            { "letra": "A", "texto": "x é a string 'abc' (parênteses apenas agrupam)", "correta": true },
            { "letra": "B", "texto": "x é uma tupla com um elemento 'abc'", "correta": false },
            { "letra": "C", "texto": "x é lista ['abc']", "correta": false },
            { "letra": "D", "texto": "Erro de sintaxe", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. Tupla de um elemento precisa da vírgula: ('abc',). Sem vírgula os parênteses apenas agrupam a expressão, resultando em string.",
            "C": "Incorreto. Colchetes criariam uma lista, não parênteses.",
            "D": "Incorreto. Sintaxe válida."
          }
        },
        {
          "id": 11,
          "enunciado": "Qual a saída de:\n```\nfor i in range(3):\n    print(i)\nelse:\n    print('fim')\n```",
          "alternativas": [
            { "letra": "A", "texto": "0\\n1\\n2\\nfim", "correta": true },
            { "letra": "B", "texto": "0\\n1\\n2", "correta": false },
            { "letra": "C", "texto": "0\\n1\\n2\\nelse\\n fim", "correta": false },
            { "letra": "D", "texto": "0\\n1\\n2\\nErro", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. O bloco `else` do `for` executa quando o laço termina sem `break` — portanto 'fim' será impresso.",
            "C": "Incorreto. Não existe impressão literal de 'else' — apenas o conteúdo do bloco else é executado.",
            "D": "Incorreto. Não há erro nesse código."
          }
        },
        {
          "id": 12,
          "enunciado": "Pegadinha com tipos: qual expressão resulta em `True`?",
          "alternativas": [
            { "letra": "A", "texto": "[] == False", "correta": false },
            { "letra": "B", "texto": "[] is False", "correta": false },
            { "letra": "C", "texto": "bool([]) == False", "correta": true },
            { "letra": "D", "texto": "not [] == True", "correta": false }
          ],
          "justificativas": {
            "A": "Incorreto. [] == False é False — listas vazias não são igual a boolean False.",
            "B": "Incorreto. `is` compara identidade de objeto, que não é o caso entre lista e False.",
            "D": "Incorreto. `not [] == True` avalia como `not ( [] == True )` → not False → True; isso pode confundir, mas a forma mais clara e correta é C. Observação: D acaba sendo True por precedência, mas é péssimo estilo."
          }
        },
        {
          "id": 13,
          "enunciado": "Qual é o resultado de `type(3/1)` em Python 3?",
          "alternativas": [
            { "letra": "A", "texto": "float", "correta": true },
            { "letra": "B", "texto": "int", "correta": false },
            { "letra": "C", "texto": "str", "correta": false },
            { "letra": "D", "texto": "complex", "correta": false }
          ],
          "justificativas": {
            "B": "Incorreto. Em Python 3, `/` sempre retorna float (mesmo 3/1 => 3.0).",
            "C": "Incorreto. Resultado numérico, não string.",
            "D": "Incorreto. Não é complexo sem parte imag."
          }
        },
        {
          "id": 14,
          "enunciado": "Pegadinha com `append` vs `extend`: dado `a = [1,2]` e `b = [3,4]`, qual comando resulta em `[1,2,3,4]`?",
          "alternativas": [
            { "letra": "A", "texto": "a.append(b)\n# resultado: [1,2,[3,4]]", "correta": false },
            { "letra": "B", "texto": "a.extend(b)\n# resultado: [1,2,3,4]", "correta": true },
            { "letra": "C", "texto": "a += [b]\n# resultado: [1,2,[3,4]]", "correta": false },
            { "letra": "D", "texto": "a = a + b\n# resultado: TypeError", "correta": false }
          ],
          "justificativas": {
            "A": "Incorreto. append adiciona a lista b como único elemento (lista aninhada).",
            "C": "Incorreto. a += [b] também adiciona b como elemento único (lista aninhada).",
            "D": "Incorreto. a = a + b funciona e resulta em [1,2,3,4] — portanto esta alternativa está errada ao afirmar TypeError."
          }
        }
      ]
    };

    let acertosCount = 0;
    const questoesRespondidas = {};

    function renderizarQuestoes() {
      const container = $('#questoes-container');
      $('#total').text(quizData.questoes.length);

      quizData.questoes.forEach((questao, index) => {
        const questaoHtml = `
          <div class="bg-white rounded-2xl shadow-xl p-8 mb-6 questao-card" data-questao-id="${questao.id}">
            <div class="flex items-start gap-3 mb-4">
              <span class="material-icons text-3xl text-indigo-500">help_outline</span>
              <h2 class="text-xl font-bold text-gray-800">${index + 1}. ${questao.enunciado}</h2>
            </div>
            
            <div class="space-y-3 alternativas-container">
              ${questao.alternativas.map((alt, altIndex) => `
                <div class="flex items-stretch gap-3">
                  <div class="flex items-center justify-center w-10 h-auto">
                    <span class="font-bold text-2xl text-indigo-600">${alt.letra}</span>
                  </div>
                  <button class="alternativa flex-1 text-left p-4 rounded-lg border-2 border-gray-200 hover:border-indigo-400 hover:bg-indigo-50 transition-all duration-200 flex items-center gap-3" data-questao-id="${questao.id}" data-correta="${alt.correta}" data-letra="${alt.letra}">
                    <span class="material-icons text-gray-400 icon-alternativa">radio_button_unchecked</span>
                    <span class="flex-1 font-medium text-gray-700">${alt.texto}</span>
                  </button>
                </div>
              `).join('')}
            </div>

            <div class="justificativa-container mt-4 hidden">
              <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-lg fade-in">
                <div class="flex items-start gap-3">
                  <span class="material-icons text-red-500 mt-1">error_outline</span>
                  <div>
                    <h3 class="font-bold text-red-800 mb-1">Resposta Incorreta</h3>
                    <p class="text-red-700 justificativa-texto"></p>
                  </div>
                </div>
              </div>
            </div>

            <div class="sucesso-container mt-4 hidden">
              <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-r-lg fade-in">
                <div class="flex items-center gap-3">
                  <span class="material-icons text-green-500">check_circle</span>
                  <p class="font-bold text-green-800">Resposta Correta! 🎉</p>
                </div>
              </div>
            </div>
          </div>
        `;
        container.append(questaoHtml);
      });
    }

    function verificarVitoria() {
      if (acertosCount === quizData.questoes.length) {
        setTimeout(() => {
          const duration = 3 * 1000;
          const end = Date.now() + duration;

          (function frame() {
            confetti({
              particleCount: 5,
              angle: 60,
              spread: 55,
              origin: { x: 0 },
              colors: ['#6366f1', '#8b5cf6', '#ec4899', '#f59e0b']
            });
            confetti({
              particleCount: 5,
              angle: 120,
              spread: 55,
              origin: { x: 1 },
              colors: ['#6366f1', '#8b5cf6', '#ec4899', '#f59e0b']
            });

            if (Date.now() < end) {
              requestAnimationFrame(frame);
            }
          }());

          // Mostra toast de vitória
          $('#toast-vitoria').removeClass('hidden').addClass('animate-bounce');
          setTimeout(() => {
            $('#toast-vitoria').removeClass('animate-bounce');
          }, 1000);

          // Auto-esconde após 5 segundos
          setTimeout(() => {
            $('#toast-vitoria').addClass('hidden');
          }, 5000);
        }, 300);
      }
    }

    $(document).on('click', '.alternativa', function () {
      const btn = $(this);
      const questaoId = btn.data('questao-id');
      const correta = btn.data('correta');
      const letra = btn.data('letra');
      const questaoCard = btn.closest('.questao-card');
      const questao = quizData.questoes.find(q => q.id === questaoId);

      // Limpa estados anteriores
      questaoCard.find('.alternativa').removeClass('bg-green-100 border-green-500 bg-red-100 border-red-500');
      questaoCard.find('.icon-alternativa').text('radio_button_unchecked').removeClass('text-green-500 text-red-500').addClass('text-gray-400');
      questaoCard.find('.justificativa-container').addClass('hidden');
      questaoCard.find('.sucesso-container').addClass('hidden');

      if (correta) {
        btn.addClass('bg-green-100 border-green-500');
        btn.find('.icon-alternativa').text('check_circle').removeClass('text-gray-400').addClass('text-green-500');
        questaoCard.find('.sucesso-container').removeClass('hidden');

        if (!questoesRespondidas[questaoId]) {
          acertosCount++;
          questoesRespondidas[questaoId] = true;
          $('#acertos').text(acertosCount);
          verificarVitoria();
        }
      } else {
        btn.addClass('bg-red-100 border-red-500');
        btn.find('.icon-alternativa').text('cancel').removeClass('text-gray-400').addClass('text-red-500');

        const justificativa = questao.justificativas[letra];
        questaoCard.find('.justificativa-texto').text(justificativa);
        questaoCard.find('.justificativa-container').removeClass('hidden');
      }
    });

    $(document).ready(function () {
      renderizarQuestoes();
    });
  </script>
</body>

</html>
