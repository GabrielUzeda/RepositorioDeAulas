<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Professor - Repositório</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-4.0.0.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card-hover { transition: transform 0.2s ease-out, box-shadow 0.2s ease-out; }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .sortable-ghost { opacity: 0.4; background: #ebf4ff !important; border: 2px dashed #4f46e5 !important; }
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
  </style>
</head>

<body class="bg-gray-100 min-h-screen">
  <header class="bg-indigo-700 shadow-lg">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="location.href='professor.html'">
        <span class="material-icons text-white text-2xl">dashboard</span>
        <h1 class="text-white text-xl font-medium">Painel do Professor</h1>
      </div>
      <div class="flex items-center space-x-4">
        <button id="backBtn" class="hidden text-white hover:bg-white/20 p-2 rounded-full transition">
          <span class="material-icons">arrow_back</span>
        </button>
        <button onclick="sessionStorage.removeItem('professor_auth'); location.reload();" class="text-white/80 hover:text-white text-sm flex items-center">
          <span class="material-icons text-sm mr-1">logout</span> Sair
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-6 py-8">
    <!-- View: Listagem de Turmas -->
    <div id="turmasView" class="fade-in">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-light text-gray-800">Minhas Turmas</h2>
        <button onclick="openTurmaModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center shadow hover:bg-indigo-700 transition">
          <span class="material-icons mr-2">add</span> Nova Turma
        </button>
      </div>
      <div id="turmasGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- View: Detalhes da Turma -->
    <div id="detalhesView" class="hidden fade-in">
      <div class="bg-white rounded-2xl p-6 shadow-sm mb-8 border-l-8 border-indigo-500 flex justify-between items-center">
        <div>
          <h2 id="viewTurmaNome" class="text-3xl font-bold text-gray-800 mb-1"></h2>
          <p id="viewTurmaDesc" class="text-gray-500 text-sm italic"></p>
        </div>
        <div class="flex space-x-2">
            <button id="btnSaveOrder" class="hidden bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center shadow hover:bg-emerald-700 transition">
                <span class="material-icons mr-2">save</span> Salvar Ordem
            </button>
            <button id="btnEditOrder" class="bg-amber-500 text-white px-4 py-2 rounded-lg flex items-center shadow hover:bg-amber-600 transition">
                <span class="material-icons mr-2">reorder</span> Organizar
            </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <section>
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold flex items-center"><span class="material-icons mr-2 text-blue-500">menu_book</span> Aulas</h3>
            <button onclick="openAulaModal()" class="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded-md text-sm font-medium transition flex items-center">
              <span class="material-icons text-sm mr-1">add</span> Adicionar Aula
            </button>
          </div>
          <div id="aulasList" class="space-y-3 bg-white p-4 rounded-xl shadow-sm border border-gray-200 min-h-[50px]"></div>
        </section>

        <section>
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold flex items-center"><span class="material-icons mr-2 text-emerald-500">assignment</span> Atividades</h3>
            <button onclick="openAtvModal()" class="text-emerald-600 hover:bg-emerald-50 px-3 py-1 rounded-md text-sm font-medium transition flex items-center">
              <span class="material-icons text-sm mr-1">add</span> Adicionar Atividade
            </button>
          </div>
          <div id="atividadesList" class="space-y-3 bg-white p-4 rounded-xl shadow-sm border border-gray-200 min-h-[50px]"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 bg-indigo-900 flex items-center justify-center z-[100]">
    <div class="bg-white rounded-3xl p-8 shadow-2xl w-full max-w-md mx-4">
      <div class="text-center mb-8">
        <div class="bg-indigo-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-600">
          <span class="material-icons text-4xl">lock</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-800">Acesso Restrito</h2>
        <p class="text-gray-500">Insira a senha do professor</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <input type="password" id="adminPassword" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Senha" required>
        <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg">Entrar</button>
      </form>
    </div>
  </div>

  <div id="formModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg shadow-2xl">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <h3 id="modalTitle" class="text-xl font-bold text-gray-800"></h3>
        <button onclick="closeFormModal()" class="text-gray-400 hover:text-gray-600"><span class="material-icons">close</span></button>
      </div>
      <form id="genericForm" class="p-6 space-y-4">
        <div id="formFields" class="space-y-4"></div>
        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="closeFormModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 shadow-md">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Alertas -->
  <div id="successModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[110]">
    <div class="bg-white rounded-2xl p-8 max-w-sm text-center">
      <span class="material-icons text-green-500 text-6xl mb-4">check_circle</span>
      <h3 id="successModalTitle" class="text-xl font-bold mb-2">Sucesso!</h3>
      <p id="successModalMessage" class="text-gray-600 mb-6"></p>
      <button class="bg-green-500 text-white px-6 py-2 rounded-lg ok-btn">OK</button>
    </div>
  </div>

  <div id="errorModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[110]">
    <div class="bg-white rounded-2xl p-8 max-w-sm text-center">
      <span class="material-icons text-red-500 text-6xl mb-4">error</span>
      <h3 class="text-xl font-bold mb-2">Erro!</h3>
      <p id="errorModalMessage" class="text-gray-600 mb-6"></p>
      <button class="bg-red-500 text-white px-6 py-2 rounded-lg ok-btn">Fechar</button>
    </div>
  </div>

  <div id="confirmModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[110]">
    <div class="bg-white rounded-2xl p-8 max-w-sm text-center">
      <span class="material-icons text-amber-500 text-6xl mb-4">help_outline</span>
      <h3 class="text-xl font-bold mb-2">Confirmar</h3>
      <p id="confirmModalMessage" class="text-gray-600 mb-6"></p>
      <div class="flex space-x-3">
        <button class="flex-1 bg-gray-100 text-gray-600 px-4 py-2 rounded-lg cancel-btn">Não</button>
        <button class="flex-1 bg-amber-500 text-white px-4 py-2 rounded-lg ok-btn">Sim</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { apiClient } from './global/api-client.js';
    import { showSuccessModal, showErrorModal, showConfirmModal, showLoadingModal, hideLoadingModal } from './global/alert-modals.js';

    let currentTurma = null;
    let turmas = [];
    let isEditingOrder = false;
    let sortableAulas, sortableAtividades;

    // --- Auth ---
    async function checkAuth() {
      if (apiClient.getProfessorPassword()) {
        $('#loginModal').hide();
        loadTurmas();
      }
    }
    $('#loginForm').on('submit', (e) => {
      e.preventDefault();
      apiClient.setProfessorPassword($('#adminPassword').val());
      location.reload();
    });

    // --- Turmas ---
    async function loadTurmas() {
      const resp = await apiClient.get('/turmas');
      if (resp.success) { turmas = resp.data; renderTurmas(); }
      else if (resp.status === 401) { sessionStorage.removeItem('professor_auth'); $('#loginModal').show(); }
    }

    function renderTurmas() {
      const $grid = $('#turmasGrid').empty();
      turmas.forEach(t => {
        const card = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 card-hover cursor-pointer" onclick="showTurmaDetails(${t.id})">
            <div class="flex justify-between items-start mb-4">
              <div class="${t.cor || 'bg-indigo-500'} p-3 rounded-xl text-white shadow-sm"><span class="material-icons">${t.icone && t.icone.length > 2 ? t.icone : 'group'}</span></div>
              <div class="flex space-x-1">
                <button class="p-2 hover:bg-gray-100 rounded-full text-gray-400" onclick="event.stopPropagation(); openTurmaModal(${t.id})"><span class="material-icons text-sm">edit</span></button>
                <button class="p-2 hover:bg-red-50 rounded-full text-red-400" onclick="event.stopPropagation(); deleteItem('turmas', ${t.id})"><span class="material-icons text-sm">delete</span></button>
              </div>
            </div>
            <h3 class="text-xl font-bold text-gray-800">${t.nome}</h3>
            <p class="text-gray-500 text-sm mt-2 line-clamp-2">${t.descricao || 'Sem descrição.'}</p>
            <p class="text-gray-400 text-[10px] mt-2 font-mono uppercase tracking-wider">URL: ${t.slug}</p>
          </div>`;
        $grid.append(card);
      });
    }

    window.showTurmaDetails = async (id) => {
      const t = turmas.find(x => x.id === id);
      currentTurma = t;
      $('#turmasView').hide(); $('#detalhesView').show(); $('#backBtn').show();
      $('#viewTurmaNome').text(t.nome);
      $('#viewTurmaDesc').text(t.descricao || 'Sem descrição.');
      
      const full = await apiClient.get(`/turmas/${id}`);
      if (full.success) loadContent(id, full.data.senha);
    };

    // --- Aulas/Atividades ---
    async function loadContent(turmaId, senha) {
      const [aulas, atvs] = await Promise.all([
        apiClient.get(`/aulas?turma_id=${turmaId}&senha=${senha}`, { silent: true }),
        apiClient.get(`/atividades?turma_id=${turmaId}&senha=${senha}`, { silent: true })
      ]);
      renderList('aulasList', aulas.data || []);
      renderList('atividadesList', atvs.data || []);
    }

    function renderList(containerId, items) {
      const $el = $(`#${containerId}`).empty();
      if (!items.length) return $el.append('<p class="text-gray-400 text-center py-4 empty-msg">Vazio.</p>');
      
      items.forEach(item => {
        const row = `
          <div class="flex items-center justify-between p-3 hover:bg-gray-50 rounded-lg group transition border border-transparent" data-id="${item.id}">
            <div class="flex items-center flex-1 min-w-0 mr-4">
              <span class="drag-handle material-icons text-gray-300 mr-2 hidden">drag_indicator</span>
              <span class="w-8 h-8 flex items-center justify-center bg-indigo-50 rounded-full text-xs font-bold text-indigo-600 mr-3 shrink-0 icon-label">${item.icone || '00'}</span>
              <div class="truncate">
                <p class="font-medium text-gray-700 truncate">${item.titulo}</p>
                <p class="text-xs text-gray-400 truncate">${item.caminho}</p>
              </div>
            </div>
            <div class="action-buttons flex space-x-1 opacity-0 group-hover:opacity-100 transition shrink-0">
              <button class="p-1 text-gray-400 hover:text-indigo-600" onclick="editItem('${containerId}', ${item.id})"><span class="material-icons text-sm">edit</span></button>
              <button class="p-1 text-gray-400 hover:text-red-500" onclick="deleteItem('${containerId.replace('List','')}', ${item.id})"><span class="material-icons text-sm">delete</span></button>
            </div>
          </div>`;
        $el.append(row);
      });
    }

    // --- Ordenação ---
    function updateVisualNumbers(containerId) {
        $(`#${containerId} > div`).each((i, el) => {
            const num = i.toString().padStart(2, '0');
            $(el).find('.icon-label').text(num);
        });
    }

    $('#btnEditOrder').on('click', function() {
        isEditingOrder = true;
        $(this).hide(); $('#btnSaveOrder').show();
        $('.drag-handle').removeClass('hidden'); 
        $('.action-buttons').addClass('hidden');
        
        const sortOptions = { 
            animation: 150, 
            handle: '.drag-handle', 
            ghostClass: 'sortable-ghost',
            onEnd: (evt) => {
                updateVisualNumbers(evt.to.id);
            }
        };

        sortableAulas = new Sortable(document.getElementById('aulasList'), sortOptions);
        sortableAtividades = new Sortable(document.getElementById('atividadesList'), sortOptions);
        
        // Renumerar imediatamente ao entrar no modo de edição para garantir consistência
        updateVisualNumbers('aulasList');
        updateVisualNumbers('atividadesList');
    });

    $('#btnSaveOrder').on('click', async function() {
        showLoadingModal('Atualizando numeração e ordem...');
        
        const saveGroup = async (listId, type) => {
            const items = [];
            $(`#${listId} > div`).each((i, el) => {
                const id = $(el).data('id');
                if (!id) return;
                const num = i.toString().padStart(2, '0');
                items.push({ id, icone: num, ordem: i });
            });

            for (const item of items) {
                const original = await apiClient.get(`/${type}/${item.id}`, { silent: true });
                if (original.success) {
                    const payload = { ...original.data, icone: item.icone, ordem: item.ordem };
                    await apiClient.put(`/${type}/${item.id}`, payload, { silent: true });
                }
            }
        };

        await saveGroup('aulasList', 'aulas');
        await saveGroup('atividadesList', 'atividades');
        
        hideLoadingModal();
        await showSuccessModal('Ordem salva com sucesso!');
        location.reload();
    });

    // --- CRUD Modals ---
    window.closeFormModal = () => $('#formModal').hide();

    function openModal(title, fields, onSubmit) {
      $('#modalTitle').text(title);
      const $container = $('#formFields').empty();
      fields.forEach(f => {
        $container.append(`
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">${f.label}</label>
            ${f.type === 'textarea' ? 
              `<textarea id="f_${f.name}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" rows="3">${f.value || ''}</textarea>` :
              `<input type="${f.type || 'text'}" id="f_${f.name}" value="${f.value || ''}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" ${f.required ? 'required' : ''} placeholder="${f.placeholder || ''}">`
            }
          </div>`);
      });
      $('#genericForm').off('submit').on('submit', async (e) => {
        e.preventDefault();
        const data = {};
        fields.forEach(f => data[f.name] = $(`#f_${f.name}`).val());
        if (await onSubmit(data)) location.reload();
      });
      $('#formModal').css('display', 'flex').show();
    }

    window.openTurmaModal = (id = null) => {
      const t = turmas.find(x => x.id === id);
      openModal(t ? 'Editar Turma' : 'Nova Turma', [
        { name: 'slug', label: 'URL (slug)', value: t?.slug, required: true },
        { name: 'nome', label: 'Nome', value: t?.nome, required: true },
        { name: 'descricao', label: 'Descrição', value: t?.descricao, type: 'textarea' },
        { name: 'cor', label: 'Cor (ex: bg-blue-500)', value: t?.cor || 'bg-indigo-500' },
        { name: 'icone', label: 'Ícone (Material Icon)', value: t?.icone || 'group' },
        { name: 'senha', label: 'Senha Alunos', placeholder: t ? 'Deixe vazio para manter' : 'Obrigatória', required: !t }
      ], async (data) => {
        if (t && !data.senha) delete data.senha;
        return (t ? await apiClient.put(`/turmas/${t.id}`, data) : await apiClient.post('/turmas', data)).success;
      });
    };

    window.openAulaModal = async (existing = null) => {
      openModal(existing ? 'Editar Aula' : 'Nova Aula', [
        { name: 'titulo', label: 'Título', value: existing?.titulo, required: true },
        { name: 'caminho', label: 'Caminho (.html)', value: existing?.caminho, required: true },
        { name: 'descricao', label: 'Descrição', value: existing?.descricao, type: 'textarea' }
      ], async (data) => {
        const payload = { ...data, turma_id: currentTurma.id, icone: existing?.icone || '00', ordem: existing?.ordem || 0 };
        return (existing ? await apiClient.put(`/aulas/${existing.id}`, payload) : await apiClient.post('/aulas', payload)).success;
      });
    };

    window.openAtvModal = async (existing = null) => {
      openModal(existing ? 'Editar Atividade' : 'Nova Atividade', [
        { name: 'titulo', label: 'Título', value: existing?.titulo, required: true },
        { name: 'caminho', label: 'Caminho', value: existing?.caminho, required: true },
        { name: 'descricao', label: 'Descrição', value: existing?.descricao, type: 'textarea' }
      ], async (data) => {
        const payload = { ...data, turma_id: currentTurma.id, icone: existing?.icone || '00', external_id: existing?.external_id || '', ordem: 0 };
        return (existing ? await apiClient.put(`/atividades/${existing.id}`, payload) : await apiClient.post('/atividades', payload)).success;
      });
    };

    window.editItem = async (listId, id) => {
        const type = listId.includes('aulas') ? 'aulas' : 'atividades';
        const resp = await apiClient.get(`/${type}/${id}`);
        if (resp.success) type === 'aulas' ? openAulaModal(resp.data) : openAtvModal(resp.data);
    };

    window.deleteItem = async (type, id) => {
      if (await showConfirmModal('Excluir permanentemente?')) {
        if ((await apiClient.delete(`/${type}/${id}`)).success) location.reload();
      }
    };

    $('#backBtn').on('click', () => location.href = 'professor.html');
    checkAuth();
  </script>
</body>
</html>
